<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="st-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="st-book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#st-bg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="22" fill="url(#st-glow)">
    <animate attributeName="r" values="20; 24; 20" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75; 1; 0.75" dur="3s" repeatCount="indefinite"/>
  </circle>

  <polygon points="32,12 53,21.5 32,31 11,21.5" fill="url(#st-book)"/>
  <path d="M19 25.5v5.5c0 3.8 5.8 7 13 7s13-3.2 13-7v-5.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 47 22; 4 47 22; -3 47 22; 0 47 22" dur="4s" repeatCount="indefinite"/>
    <path d="M47 22v9.5c0 1.2-0.8 2-2 2" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="34" r="1.6" fill="#fbbf24"/>
  </g>

  <path d="M16 38.5c4.8-2 10.2-1.5 16 2.5 5.8-4 11.2-4.5 16-2.5v11.5c-4.8-2-10.2-1.5-16 2.5-5.8-4-11.2-4.5-16-2.5z" fill="url(#st-book)" opacity="0.95"/>
  <line x1="32" y1="41" x2="32" y2="52.5" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"/>

  <g transform-origin="32 27.5">
    <animateTransform attributeName="transform" type="scale" values="1; 1.25; 1" dur="2.4s" repeatCount="indefinite"/>
    <path d="M32 23c0 2.5-1.8 4.2-4.5 4.5 2.7 0.3 4.5 2 4.5 4.5 0-2.5 1.8-4.2 4.5-4.5-2.7-0.3-4.5-2-4.5-4.5z" fill="url(#st-spark)" filter="url(#glow-filter)"/>
  </g>

  <circle cx="11" cy="21.5" r="1.5" fill="#93c5fd">
    <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="53" cy="21.5" r="1.5" fill="#93c5fd">
    <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="12" r="1.5" fill="#93c5fd">
    <animate attributeName="opacity" values="0.4; 1; 0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
